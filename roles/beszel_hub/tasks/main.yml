---
- name: Create persistent directory for the Beszel Hub
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ beszel_hub_dir }}"
    - "{{ beszel_hub_dir }}/data"

- name: Install Beszel Hub Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ beszel_hub_dir }}/compose.yml"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Ensure Beszel Hub is running and remove the former bundled Agent
  ansible.builtin.command:
    cmd: docker-compose -f compose.yml up -d --remove-orphans
    chdir: "{{ beszel_hub_dir }}"
  register: beszel_hub_compose_up
  changed_when: >-
    beszel_hub_compose_up.stdout is search('(?im)^(Creating|Recreating|Starting|Removing|Stopping) ')

- name: Wait for the Beszel Hub API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ beszel_hub_port }}/api/health"
    method: GET
    status_code: 200
  register: beszel_health
  retries: 30
  delay: 2
  until: beszel_health.status == 200
  changed_when: false

- name: Authenticate to the Beszel Hub API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ beszel_hub_port }}/api/collections/users/auth-with-password"
    method: POST
    body_format: json
    body:
      identity: "{{ beszel_admin_email }}"
      password: "{{ beszel_admin_password }}"
    status_code: 200
  register: beszel_auth
  changed_when: false
  no_log: true

- name: Read the Beszel Hub public key
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ beszel_hub_port }}/api/beszel/getkey"
    method: GET
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
    status_code: 200
  register: beszel_public_key_response
  changed_when: false
  no_log: true

- name: Read Beszel universal token state
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ beszel_hub_port }}/api/beszel/universal-token"
    method: GET
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
    status_code: 200
  register: beszel_universal_token_state
  changed_when: false
  no_log: true

- name: Enable permanent Beszel universal token when needed
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ beszel_hub_port }}/api/beszel/universal-token?enable=1&permanent=1"
    method: GET
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
    status_code: 200
  register: beszel_universal_token_enabled
  when: >-
    not beszel_universal_token_state.json.active or
    not beszel_universal_token_state.json.permanent
  changed_when: true
  no_log: true

- name: Set Beszel Agent registration credentials for dependent Agent play
  ansible.builtin.set_fact:
    beszel_agent_key: "{{ beszel_public_key_response.json.key }}"
    beszel_agent_token: "{{ (beszel_universal_token_enabled.json if beszel_universal_token_enabled is changed else beszel_universal_token_state.json).token }}"
  no_log: true

- name: Save Beszel Agent credentials for Agent-only runs
  ansible.builtin.copy:
    content: "{{ {'key': beszel_agent_key, 'token': beszel_agent_token} | to_nice_json }}\n"
    dest: "{{ beszel_agent_credentials_file }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
