---
beszel_agent_dir: "{{ services_root }}/beszel-agent"
beszel_agent_data_dir: "{{ beszel_agent_dir }}/data"
beszel_agent_image: "henrygd/beszel-agent:{{ beszel_version }}"
beszel_agent_docker_socket: false
beszel_hub_host: "{{ groups['beszel_hub'][0] }}"
beszel_hub_url: "{{ hostvars[beszel_hub_host].beszel_hub_app_url }}"
beszel_agent_credentials_file: "{{ hostvars[beszel_hub_host].beszel_agent_credentials_file }}"
