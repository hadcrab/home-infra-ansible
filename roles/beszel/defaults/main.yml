---
beszel_dir: /opt/homelab/beszel
beszel_version: 0.21.2
beszel_hub_image: "henrygd/beszel:{{ beszel_version }}"
beszel_agent_image: "henrygd/beszel-agent:{{ beszel_version }}"
beszel_hub_port: 8090
beszel_agent_port: 45876
beszel_app_url: "http://{{ vault_pi_ip }}:{{ beszel_hub_port }}"
beszel_admin_email: "{{ vault_beszel_email }}"
beszel_admin_password: "{{ vault_beszel_pass }}"
beszel_agent_credentials_file: "{{ beszel_dir }}/agent-credentials.json"
beszel_agent_system_name: "{{ inventory_hostname }}"
